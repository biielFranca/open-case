services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opencase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - opencase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opencase"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "Host=db;Port=5432;Database=opencase;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8080:8080"

volumes:
  opencase-db:
